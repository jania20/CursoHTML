

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form action="#" method="post">
        <div>    
            <label for="nombre">Nombre:</label>
            <input id="nombre" type="text" name="nombre">
        </div>
        <div>
          <label for="apellido">Apellido</label>
            <input id="apellido" type="text" name="apellido">
        </div>
        <div>
            
            <label for="edad">Edad</label>
            <input id="edad" type="number" name="edad" min="18" max="70">
        </div>
        
        <div>
        <label for="correo">Correo</label>
        <input id="correo" type="email" required placeholder="usuario@ejemplo.com">
        </div> 

        <div>
            <label for="text_area_mensaje">Mensaje</label>    
            <textarea name="mensaje" id="text_area_mensaje" cols="30" rows="10"></textarea>
        </div>
        <div>
            <button type="submit">Enviar</button>
        </div>
        <div>
            <label for="password" >Password</label>
            <input id="password" name="password" type="password" required placeholder="Minimo 8 caracteres" minlenght="8">
        </div>

        <div>
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" min="2024-01-01" >
        </div>
        <div>
            <label for="color">Color</label>
                <input id="color" name="color" type="color">
        </div>

        <fieldset>
            <legend>Genero</legend>
            <input type="radio" name="genero" id="masculino" value="M">
            <label for="masculino" >masculino</label>

            <input type="radio" name="genero" id="femenino" value="F">
            <label for="femenino">femenino</label>
        </fieldset>

        <fieldset>
            <legen>Intereses</legen>
            <input type="checkbox" name="intereses" id="deportes" >
            <label for="deportes" value="deportes">Deportes</label>

            <input type="checkbox" name="intereses" id="m">
            <label for = "Musica" >Musica</label>
        </fieldset>

        <div>
            <label for="pais">Paises</label>
            <select name="pais" id="pais">
                <option value="Mexico">Mexico</option>
                <option value="Estados Unidos">Estados unidos</option>
                <option value="Canada">Canada</option>
                <option value="Colombia">Colombia</option>
            </select>
            
        </div>
    </form>
</body>
</html>
